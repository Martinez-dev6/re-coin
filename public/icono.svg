<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fondo a sangre: iOS redondea las esquinas por su cuenta y Android recorta el ícono "maskable". -->
  <rect width="512" height="512" fill="#2a4dff"/>
  <!-- Símbolo dentro de la zona segura central (círculo del 80 %) -->
  <g fill="#ffffff">
    <rect x="144" y="256" width="56" height="120" rx="16"/>
    <rect x="228" y="196" width="56" height="180" rx="16"/>
    <rect x="312" y="136" width="56" height="240" rx="16"/>
  </g>
</svg>
