<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Re-Coin</title>
    <meta name="description" content="Finanzas personales: cuentas, movimientos, presupuestos y metas." />
    <meta name="theme-color" content="#203fe3" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icono.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- iPhone instalado desde Safari. Sin barra de estado translúcida (black-translucent):
         desde iOS 26 el sistema dibuja encima un degradado borroso ("Liquid Glass") que
         la página no puede quitar. Con la barra por defecto, iOS la pinta opaca.
         Su color NO sale de theme-color (iOS 26+ lo ignora; se deja para otros navegadores)
         sino del componente BarraEstado (franja fija arriba). iOS lee este estilo al añadir
         la app a la pantalla de inicio: si cambia, hay que borrarla y añadirla de nuevo. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Re-Coin" />

    <!-- Fondo oscuro desde el primer instante si corresponde (evita un destello claro al abrir).
         Lee la misma clave que src/tema/preferencias.js; el resto del tema lo aplica la app. -->
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('sendo.tema') || '{}');
        if (p.modo === 'oscuro' || (p.modo === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.style.setProperty('--page-bg', '#151515');
          document.documentElement.style.colorScheme = 'dark';
        }
        // Color de la pantalla de bienvenida mientras carga la app (después usa --banner-bg).
        var acento = /^#[0-9a-f]{6}$/i.test(p.acento || '') ? p.acento : '#203fe3';
        // Color del tema realista: arriba el banner es más claro (16 % de blanco, como --banner-tope) y
        // la bienvenida va de ese tono: así la zona de la hora no cambia de color cuando se va.
        var ajustes = JSON.parse(localStorage.getItem('sendo.ajustes') || '{}');
        if (ajustes.estiloTema === 'realista') {
          document.documentElement.dataset.estiloTema = 'realista';
          var n = parseInt(acento.slice(1), 16);
          acento = 'rgb(' + [n >> 16, (n >> 8) & 255, n & 255].map(function (v) { return Math.round(v + (255 - v) * 0.16); }).join(',') + ')';
        }
        document.documentElement.style.setProperty('--bienvenida', acento);
      } catch (e) {}
    </script>

    <!-- Pantalla de bienvenida: todo del color del tema con el mapache en el medio. La quita
         src/main.jsx con un fundido cuando la app ya está dibujada debajo. Va por encima de todo,
         también de la franja de la barra de estado (BarraEstado, z-index hasta 300): así la isla
         toma su color. -->
    <style>
      #bienvenida {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--banner-bg, var(--bienvenida, #203fe3));
        transition: opacity 420ms cubic-bezier(0.35, 0.1, 0.15, 1);
      }
      #bienvenida img {
        width: 132px;
        height: auto;
        animation: bienvenida-entra 520ms cubic-bezier(0.27, 0.34, 0.08, 1) both;
        transition: transform 420ms cubic-bezier(0.35, 0.1, 0.15, 1);
      }
      /* Realista: el tono de arriba del banner (lo pone aplicarTema; antes, --bienvenida ya aclarado). */
      :root[data-estilo-tema='realista'] #bienvenida {
        background: var(--banner-tope, var(--bienvenida, #203fe3));
      }
      #bienvenida.bienvenida-saliendo {
        opacity: 0;
        pointer-events: none;
      }
      #bienvenida.bienvenida-saliendo img {
        transform: scale(1.12);
      }
      @keyframes bienvenida-entra {
        from { opacity: 0; transform: scale(0.88); }
      }
      @media (prefers-reduced-motion: reduce) {
        #bienvenida img { animation: none; transition: none; }
        #bienvenida.bienvenida-saliendo img { transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="bienvenida" aria-hidden="true"><img src="/mapache.png" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
