    <!-- iPhone instalado desde Safari. Sin barra de estado translúcida (black-translucent):
         desde iOS 26 el sistema dibuja encima un degradado borroso ("Liquid Glass") que
         la página no puede quitar. Con la barra por defecto, iOS la pinta opaca.
         Su color NO sale de theme-color (iOS 26+ lo ignora; se deja para otros navegadores)
         sino del componente BarraEstado (franja fija arriba). iOS lee este estilo al añadir
         la app a la pantalla de inicio: si cambia, hay que borrarla y añadirla de nuevo. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sendo" />
